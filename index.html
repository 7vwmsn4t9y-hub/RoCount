<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RoCount</title>
<meta name="description" content="Gérez les dépenses partagées de vos voyages et événements entre amis.">
<meta name="theme-color" content="#EEEAE0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="RoCount">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  :root{
    --paper:#EEEAE0;
    --paper-raised:#FFFFFF;
    --paper-sunken:#E4DFD1;
    --ink:#26241E;
    --ink-muted:#726C5C;
    --ink-faint:#A39C89;
    --accent:#1F6F5C;
    --accent-ink:#F4FBF8;
    --negative:#A8402A;
    --line:#D8D0BC;
    --shadow: 0 1px 2px rgba(38,36,30,.06), 0 8px 24px rgba(38,36,30,.08);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#17181A;
      --paper-raised:#202226;
      --paper-sunken:#0F1011;
      --ink:#EEEAE0;
      --ink-muted:#9C9686;
      --ink-faint:#6B6659;
      --accent:#54C8A8;
      --accent-ink:#0C201B;
      --negative:#E58469;
      --line:#34342F;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --paper:#17181A;
    --paper-raised:#202226;
    --paper-sunken:#0F1011;
    --ink:#EEEAE0;
    --ink-muted:#9C9686;
    --ink-faint:#6B6659;
    --accent:#54C8A8;
    --accent-ink:#0C201B;
    --negative:#E58469;
    --line:#34342F;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    color-scheme: dark;
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{background:var(--paper); height:100%;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    justify-content:center;
    overscroll-behavior-y:none;
  }
  #app{
    width:100%;
    max-width:480px;
    min-height:100vh;
    min-height:100dvh;
    background:var(--paper);
    display:flex;
    flex-direction:column;
    position:relative;
    padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 8px);
  }
  h1,h2,h3,.serif{
    font-family: ui-serif, "New York", Georgia, "Iowan Old Style", serif;
    font-weight:600;
    letter-spacing:-0.01em;
    text-wrap:balance;
    margin:0;
  }
  .mono, .amount{
    font-family: ui-monospace, "SF Mono", "Menlo", "Cascadia Mono", monospace;
    font-variant-numeric: tabular-nums;
  }
  button{font-family:inherit; -webkit-appearance:none;}
  input,select,textarea{font-family:inherit; font-size:16px;}
  a{color:inherit;}
  ::selection{background:var(--accent); color:var(--accent-ink);}

  .topbar{
    position:sticky; top:0; z-index:20;
    display:flex; align-items:center; gap:10px;
    padding: calc(env(safe-area-inset-top,0px) + 14px) 18px 12px;
    background:var(--paper);
  }
  .topbar h1{font-size:1.5rem;}
  .topbar .sub{font-size:.8rem; color:var(--ink-muted); margin-top:2px;}
  .icon-btn{
    width:38px; height:38px; border-radius:50%;
    border:1px solid var(--line); background:var(--paper-raised);
    display:flex; align-items:center; justify-content:center;
    font-size:1.05rem; cursor:pointer; color:var(--ink);
    flex-shrink:0;
  }
  .icon-btn:active{transform:scale(.94);}
  .icon-btn.ghost{border-color:transparent; background:transparent;}

  main{flex:1; padding: 0 18px 100px; display:flex; flex-direction:column; gap:14px;}

  .empty{
    text-align:center; padding:48px 20px; color:var(--ink-muted);
  }
  .empty .glyph{font-size:2.4rem; display:block; margin-bottom:10px;}

  .card{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:16px;
    box-shadow:var(--shadow);
  }

  .group-card{
    display:flex; align-items:center; gap:12px;
    padding:14px 16px; cursor:pointer;
  }
  .group-card:active{transform:scale(.99);}
  .group-emoji{
    width:46px; height:46px; border-radius:13px;
    background:var(--paper-sunken);
    display:flex; align-items:center; justify-content:center;
    font-size:1.4rem; flex-shrink:0;
  }
  .group-info{flex:1; min-width:0;}
  .group-info .name{font-size:1.02rem; font-weight:600; font-family: ui-serif, "New York", Georgia, serif;}
  .group-info .meta{font-size:.78rem; color:var(--ink-muted); margin-top:2px;}
  .group-total{text-align:right; flex-shrink:0;}
  .group-total .val{font-size:.98rem; font-weight:600;}
  .group-total .lbl{font-size:.68rem; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.04em;}

  .avatar{
    width:26px; height:26px; border-radius:50%;
    display:inline-flex; align-items:center; justify-content:center;
    font-size:.62rem; font-weight:700; color:#fff;
    border:2px solid var(--paper-raised);
    flex-shrink:0;
  }
  .avatar.lg{width:40px;height:40px;font-size:.95rem;border-width:0;}
  .avatar.xl{width:52px;height:52px;font-size:1.15rem;border-width:0;}
  .avatar-stack{display:flex;}
  .avatar-stack .avatar{margin-left:-8px;}
  .avatar-stack .avatar:first-child{margin-left:0;}

  .btn{
    border:none; border-radius:12px; padding:13px 18px;
    font-size:.95rem; font-weight:600; cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
  }
  .btn-primary{background:var(--accent); color:var(--accent-ink);}
  .btn-primary:active{opacity:.85;}
  .btn-secondary{background:var(--paper-sunken); color:var(--ink);}
  .btn-ghost{background:transparent; color:var(--ink-muted); padding:10px 8px;}
  .btn-danger{background:transparent; color:var(--negative);}
  .btn-block{width:100%;}
  .btn:disabled{opacity:.4; cursor:not-allowed;}

  .fab{
    position:fixed; bottom: calc(env(safe-area-inset-bottom,0px) + 24px); right:calc(50% - 240px + 22px);
    width:58px; height:58px; border-radius:50%;
    background:var(--accent); color:var(--accent-ink);
    border:none; font-size:1.7rem; box-shadow:0 10px 24px rgba(31,111,92,.35);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; z-index:30;
  }
  @media (max-width:524px){ .fab{ right:22px; } }
  .fab:active{transform:scale(.93);}

  .segmented{
    display:flex; background:var(--paper-sunken); border-radius:12px; padding:3px; gap:2px;
  }
  .segmented button{
    flex:1; border:none; background:transparent; padding:9px 6px;
    border-radius:9px; font-size:.85rem; font-weight:600; color:var(--ink-muted);
    cursor:pointer;
  }
  .segmented button.active{background:var(--paper-raised); color:var(--ink); box-shadow:var(--shadow);}

  .back-row{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  .title-row{display:flex; align-items:center; gap:12px; margin-bottom:14px;}
  .title-row h2{font-size:1.35rem;}
  .title-row .sub{font-size:.8rem; color:var(--ink-muted);}
  .stat-row{display:flex; gap:10px;}
  .stat{flex:1; background:var(--paper-raised); border:1px solid var(--line); border-radius:14px; padding:12px 14px;}
  .stat .lbl{font-size:.66rem; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); margin-bottom:4px;}
  .stat .val{font-size:1.05rem; font-weight:700;}
  .stat .val.pos{color:var(--accent);}
  .stat .val.neg{color:var(--negative);}

  .day-label{font-size:.72rem; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); margin: 6px 2px 0;}

  .expense-row{
    display:flex; align-items:center; gap:12px; padding:13px 14px; cursor:pointer;
    border-bottom:1px dashed var(--line);
  }
  .expense-row:last-child{border-bottom:none;}
  .expense-row:active{background:var(--paper-sunken);}
  .expense-icon{
    width:38px; height:38px; border-radius:11px; background:var(--paper-sunken);
    display:flex; align-items:center; justify-content:center; font-size:1.1rem; flex-shrink:0;
  }
  .expense-mid{flex:1; min-width:0;}
  .expense-mid .desc{font-size:.94rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .expense-mid .who{font-size:.76rem; color:var(--ink-muted); margin-top:1px; display:flex; align-items:center; gap:5px;}
  .expense-mid .who .avatar{width:16px;height:16px;font-size:.5rem;border-width:1px;}
  .expense-amt{text-align:right; flex-shrink:0; font-weight:700; font-size:.95rem;}
  .expense-row.transfer .expense-amt{color:var(--accent);}

  .balance-row{
    display:flex; align-items:center; gap:12px; padding:13px 16px;
    border-bottom:1px dashed var(--line);
  }
  .balance-row:last-child{border-bottom:none;}
  .balance-name{flex:1; font-weight:600; font-size:.94rem; display:flex; align-items:center; gap:10px;}
  .balance-val{font-weight:700; font-size:.95rem;}
  .balance-val.pos{color:var(--accent);}
  .balance-val.neg{color:var(--negative);}
  .balance-val.zero{color:var(--ink-faint);}

  .settle-item{border-bottom:1px dashed var(--line);}
  .settle-item:last-child{border-bottom:none;}
  .settle-row{
    display:flex; align-items:center; gap:12px; padding:13px 16px 10px;
  }
  .settle-btn-wrap{padding:0 16px 14px;}
  .settle-who{display:flex; align-items:center; gap:6px; flex:1; font-size:.88rem; line-height:1.3;}
  .settle-who .avatar{width:22px;height:22px;font-size:.6rem;border-width:0;}
  .settle-arrow{color:var(--ink-faint); font-size:1rem;}
  .settle-amt{font-size:.82rem; color:var(--ink-muted); text-align:center; margin:0 2px;}

  .section-title{font-size:.72rem; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint); padding:4px 2px;}

  .member-row{display:flex; align-items:center; gap:12px; padding:12px 14px; border-bottom:1px dashed var(--line);}
  .member-row:last-child{border-bottom:none;}
  .member-row .name{flex:1; font-weight:600; font-size:.92rem;}
  .member-row .rm{background:none; border:none; color:var(--ink-faint); font-size:1.1rem; cursor:pointer; padding:6px;}

  .field{display:flex; flex-direction:column; gap:6px; margin-bottom:16px;}
  .field label{font-size:.72rem; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-muted); font-weight:600;}
  .field input[type=text], .field input[type=number], .field input[type=date], .field select{
    border:1px solid var(--line); background:var(--paper-sunken); color:var(--ink);
    border-radius:11px; padding:12px 13px; font-size:16px; outline:none;
  }
  .field input:focus-visible, .field select:focus-visible, button:focus-visible{
    outline: 2px solid var(--accent); outline-offset:2px;
  }
  .amount-input{display:flex; align-items:center; gap:8px;}
  .amount-input input{flex:1; font-family: ui-monospace, "SF Mono", monospace; font-size:1.3rem; font-weight:700;}
  .amount-input .cur{font-size:1.1rem; color:var(--ink-muted); font-weight:600;}

  .chip-row{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{
    border:1px solid var(--line); background:var(--paper-sunken); color:var(--ink);
    border-radius:999px; padding:8px 14px 8px 8px; font-size:.86rem; font-weight:600; cursor:pointer;
    display:flex; align-items:center; gap:7px;
  }
  .chip.no-avatar{padding:9px 14px;}
  .chip.selected{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
  .chip .avatar{border-width:0; box-shadow:0 0 0 2px rgba(255,255,255,.5);}
  .chip.selected .avatar{box-shadow:0 0 0 2px var(--accent-ink);}
  .chip .check{font-size:.9rem;}

  .cat-row{display:flex; flex-wrap:wrap; gap:8px;}
  .cat-chip{
    width:52px; display:flex; flex-direction:column; align-items:center; gap:4px;
    border:none; background:transparent; cursor:pointer; padding:4px;
  }
  .cat-chip .cat-emoji{
    width:44px; height:44px; border-radius:13px; background:var(--paper-sunken);
    display:flex; align-items:center; justify-content:center; font-size:1.25rem;
    border:2px solid transparent;
  }
  .cat-chip.selected .cat-emoji{border-color:var(--accent); background:var(--paper-raised);}
  .cat-chip .cat-lbl{font-size:.62rem; color:var(--ink-muted); text-align:center; line-height:1.1;}

  .split-row{display:flex; align-items:center; gap:10px; padding:8px 2px;}
  .split-row .nm{flex:1; font-size:.88rem; font-weight:600; display:flex; align-items:center; gap:8px;}
  .split-row input{width:96px; text-align:right; border:1px solid var(--line); background:var(--paper-sunken); border-radius:9px; padding:8px 9px; font-family:ui-monospace,monospace; font-size:16px;}
  .split-remainder{font-size:.78rem; text-align:right; color:var(--ink-muted); padding:4px 2px 0;}
  .split-remainder.err{color:var(--negative); font-weight:700;}

  .sheet-backdrop{
    position:fixed; inset:0; background:rgba(20,18,14,.4); z-index:40;
    display:flex; align-items:flex-end; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity .22s ease;
  }
  .sheet-backdrop.open{opacity:1; pointer-events:auto;}
  .sheet{
    width:100%; max-width:480px; max-height:88vh; overflow-y:auto;
    background:var(--paper); border-radius:22px 22px 0 0;
    padding: 14px 20px calc(env(safe-area-inset-bottom,0px) + 24px);
    transform:translateY(100%); transition:transform .28s cubic-bezier(.32,.72,0,1);
    box-shadow:0 -12px 40px rgba(0,0,0,.25);
  }
  .sheet-backdrop.open .sheet{transform:translateY(0);}
  .sheet-handle{width:36px; height:4px; background:var(--line); border-radius:99px; margin:2px auto 14px;}
  .sheet h3{font-size:1.15rem; margin-bottom:16px;}
  .sheet-actions{display:flex; gap:10px; margin-top:6px;}
  .sheet-actions .btn{flex:1;}

  @media (prefers-reduced-motion: reduce){
    .sheet, .sheet-backdrop{transition:none;}
  }

  .toast{
    position:fixed; bottom:calc(env(safe-area-inset-bottom,0px) + 90px); left:50%;
    transform:translateX(-50%) translateY(10px); background:var(--ink); color:var(--paper);
    padding:11px 18px; border-radius:99px; font-size:.85rem; font-weight:600;
    opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:60;
    max-width:90%; text-align:center;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  .footnote{font-size:.72rem; color:var(--ink-faint); text-align:center; line-height:1.5; padding:6px 20px 0;}
</style>
</head>
<body>
<div id="app"></div>

<script src="firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>

<script>
(function(){
  "use strict";

  var STORAGE_KEY = "ecot_state_v3";
  var CURRENCIES = ["ARS","EUR","USD"];
  var GROUP_EMOJIS = ["🎉","🏖️","🏔️","🍽️","🚗","🏠","🎓","⚽️","🎸","🛳️","🎄","🧳"];
  var CATEGORIES = [
    {emoji:"🎟️", label:"Billet"},
    {emoji:"🍹", label:"Bar"},
    {emoji:"🚕", label:"Taxi/VTC"},
    {emoji:"⛽️", label:"Essence"},
    {emoji:"🅿️", label:"Parking"},
    {emoji:"🍔", label:"Bouffe"},
    {emoji:"🛒", label:"Courses"},
    {emoji:"🏠", label:"Logement"},
    {emoji:"⛺️", label:"Festival"},
    {emoji:"🧥", label:"Vestiaire"},
    {emoji:"🎉", label:"Sortie"},
    {emoji:"🧾", label:"Autre"}
  ];
  var AVATAR_COLORS = ["#1F6F5C","#A8402A","#3B6EA5","#B08628","#6C5B9E","#3E8E7E","#C0563F","#4A7A3D","#8A4B6B","#5A6472"];

  function uid(){
    if(window.crypto && crypto.getRandomValues){
      var arr = new Uint8Array(12);
      crypto.getRandomValues(arr);
      return Array.prototype.map.call(arr, function(b){ return b.toString(16).padStart(2,"0"); }).join("");
    }
    return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
  }
  function todayISO(){ var d=new Date(); return d.toISOString().slice(0,10); }
  function escapeHtml(s){
    return String(s==null?"":s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function colorFor(id){
    var h=0; for(var i=0;i<id.length;i++){ h = (h*31 + id.charCodeAt(i)) >>> 0; }
    return AVATAR_COLORS[h % AVATAR_COLORS.length];
  }
  function initials(name){
    var parts = name.trim().split(/\s+/);
    var s = (parts[0]?parts[0][0]:"") + (parts[1]?parts[1][0]:"");
    return s.toUpperCase() || "?";
  }
  function findContact(id){ return state.contacts.find(function(c){return c.id===id;}); }
  function personName(id){ var c=findContact(id); return c?c.name:"—"; }
  function avatarHtml(id, size){
    var name = personName(id);
    var cls = "avatar" + (size?(" "+size):"");
    return '<span class="'+cls+'" style="background:'+colorFor(id)+'">'+initials(name)+'</span>';
  }
  function fmtMoney(cents, currency){
    var v = cents/100;
    try{
      return new Intl.NumberFormat("fr-FR",{style:"currency", currency: currency||"EUR"}).format(v);
    }catch(e){ return v.toFixed(2) + " " + (currency||"EUR"); }
  }
  function fmtSignedMoney(cents, currency){
    var s = fmtMoney(Math.abs(cents), currency);
    return (cents<0? "−" : (cents>0? "+" : "")) + s;
  }
  function fmtDate(iso){
    try{
      var d = new Date(iso+"T00:00:00");
      return new Intl.DateTimeFormat("fr-FR",{day:"numeric", month:"short"}).format(d);
    }catch(e){ return iso; }
  }
  function parseAmountToCents(str){
    if(str==null) return NaN;
    var cleaned = String(str).trim().replace(/\s/g,"").replace(",",".");
    if(cleaned==="") return NaN;
    var v = parseFloat(cleaned);
    if(isNaN(v)) return NaN;
    return Math.round(v*100);
  }

  function loadState(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){}
    return seedState();
  }
  function seedState(){
    var alice = uid(), bruno = uid(), chloe = uid();
    var g1 = uid();
    var e1 = uid(), e2 = uid(), e3 = uid();
    return {
      contacts: [
        {id:alice, name:"Alice"},
        {id:bruno, name:"Bruno"},
        {id:chloe, name:"Chloé"}
      ],
      meId: null,
      groups: [
        {
          id: g1, name: "Exemple — Week-end à Lisbonne", emoji:"🏖️", currency:"EUR",
          members: [alice, bruno, chloe],
          expenses: [
            {id:e1, type:"expense", description:"Airbnb", amountCents:24000, payerId:alice, participantIds:[alice,bruno,chloe], splitMode:"equal", date: todayISO(), emoji:"🏠", createdAt: Date.now()-300000},
            {id:e2, type:"expense", description:"Courses", amountCents:5230, payerId:bruno, participantIds:[alice,bruno,chloe], splitMode:"equal", date: todayISO(), emoji:"🛒", createdAt: Date.now()-200000},
            {id:e3, type:"expense", description:"Dîner au Time Out Market", amountCents:8700, payerId:chloe, participantIds:[alice,bruno,chloe], splitMode:"equal", date: todayISO(), emoji:"🍽️", createdAt: Date.now()-100000}
          ],
          createdAt: Date.now()-400000
        }
      ]
    };
  }
  function migrateToContacts(){
    if(state.contacts) return;
    var contacts = [];
    var nameToId = {};
    state.groups.forEach(function(g){
      var newMembers = [];
      (g.members||[]).forEach(function(m){
        var name = (m && m.name) || "?";
        var key = name.trim().toLowerCase();
        var cid = nameToId[key];
        if(!cid){
          cid = (m && m.id) || uid();
          nameToId[key] = cid;
          contacts.push({id:cid, name:name});
        }
        newMembers.push(cid);
      });
      g.members = newMembers;
    });
    state.contacts = contacts;
    if(state.meId===undefined) state.meId = null;
    delete state.meByGroup;
  }
  var state = loadState();
  migrateToContacts();
  function save(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
  }

  var cloudReady = false;
  var db = null;
  var cloudUnsub = {};
  function initCloud(){
    try{
      var cfg = window.ECOT_FIREBASE_CONFIG;
      if(!cfg || !cfg.apiKey || cfg.apiKey.indexOf("REMPLACE")>=0) return;
      if(typeof firebase==="undefined") return;
      firebase.initializeApp(cfg);
      db = firebase.firestore();
      cloudReady = true;
    }catch(e){ cloudReady = false; }

  function mergeContactsFromGroup(remote){
    if(!remote || !remote.memberNames) return;
    Object.keys(remote.memberNames).forEach(function(cid){
      if(!findContact(cid)){

      }
    });
  }
  function subscribeGroup(groupId){
    if(!cloudReady || cloudUnsub[groupId]) return;
    cloudUnsub[groupId] = db.collection("ecot-groups").doc(groupId).onSnapshot(function(snap){
      if(!snap.exists) return;
      var remote = snap.data();
      remote.cloud = true;
      mergeContactsFromGroup(remote);
      var idx = state.groups.findIndex(function(x){return x.id===groupId;});
      if(idx>=0) state.groups[idx] = remote; else state.groups.unshift(remote);
      save();
      if(ui.screen==="home" || (ui.screen==="group" && ui.groupId===groupId) || ui.screen==="profiles") render();
    }, function(){ /* connection issue: keep working from local cache */ });
  }
  function subscribeAllCloudGroups(){
    if(!cloudReady) return;
    state.groups.forEach(function(g){ if(g.cloud) subscribeGroup(g.id); });
  }
  function syncGroupToCloud(g){
    if(!cloudReady || !g.cloud) return;
    var data = JSON.parse(JSON.stringify(g));
    data.memberNames = {};
    g.members.forEach(function(id){ data.memberNames[id] = personName(id); });
    db.collection("ecot-groups").doc(g.id).set(data).catch(function(){});
  }
  function persist(g){

      var remote = snap.data();

      var idx = state.groups.findIndex(function(x){return x.id===gid;});

  function shareOfExpense(e, personId){
    if(e.type!=="expense" || e.participantIds.indexOf(personId)<0) return 0;
    if(e.splitMode==="custom" && e.customShares){
      return e.customShares[personId] || 0;
    }
    var n = e.participantIds.length || 1;
    var idx = e.participantIds.indexOf(personId);
    var share = Math.floor(e.amountCents/n);
    var rem = e.amountCents - share*n;
    return share + (idx<rem?1:0);
  }
  function computeBalances(g){
    var bal = {}; g.members.forEach(function(id){ bal[id]=0; });
    g.expenses.forEach(function(e){
      if(e.type==="expense"){
        if(bal[e.payerId]==null) return;
        bal[e.payerId]+=e.amountCents;
        if(e.splitMode==="custom" && e.customShares){
          Object.keys(e.customShares).forEach(function(pid){
            if(bal[pid]!=null) bal[pid]-=e.customShares[pid];
          });
        } else {
          var parts = e.participantIds.filter(function(pid){return bal[pid]!=null;});
          var n = parts.length || 1;
          var share = Math.floor(e.amountCents/n);
          var rem = e.amountCents - share*n;
          parts.forEach(function(pid,i){
            bal[pid] -= share + (i<rem?1:0);
          });
        }
      } else if(e.type==="transfer"){
        if(bal[e.fromId]!=null) bal[e.fromId]+=e.amountCents;
        if(bal[e.toId]!=null) bal[e.toId]-=e.amountCents;
      }
    });
    return bal;
  }
  function simplifyDebts(bal){
    var creditors=[], debtors=[];
    Object.keys(bal).forEach(function(id){
      var amt = bal[id];
      if(amt>0.5) creditors.push({id:id, amt:amt});
      else if(amt<-0.5) debtors.push({id:id, amt:-amt});
    });
    creditors.sort(function(a,b){return b.amt-a.amt;});
    debtors.sort(function(a,b){return b.amt-a.amt;});
    var res=[], i=0, j=0;
    while(i<debtors.length && j<creditors.length){
      var pay = Math.min(debtors[i].amt, creditors[j].amt);
      if(pay>0.5) res.push({from:debtors[i].id, to:creditors[j].id, amount:Math.round(pay)});
      debtors[i].amt-=pay; creditors[j].amt-=pay;
      if(debtors[i].amt<=0.5) i++;
      if(creditors[j].amt<=0.5) j++;
    }
    return res;
  }
  function totalSpent(g){
    return g.expenses.filter(function(e){return e.type==="expense";}).reduce(function(s,e){return s+e.amountCents;},0);
  }

  function renderStats(){
    var h = "";
    h += '<div class="topbar"><button class="icon-btn ghost" data-act="go-home" aria-label="Retour">←</button>';
    h += '<div style="flex:1;"><h1 style="font-size:1.3rem;">Statistiques</h1><div class="sub">Tes dépenses avec chacun</div></div></div>';
    h += '<main>';
    if(!state.meId){
      h += '<div class="empty"><span class="glyph">🧑‍🤝‍🧑</span>Indique qui tu es dans Profils pour voir tes statistiques.</div>';
      h += '<button class="btn btn-secondary btn-block" data-act="open-profiles">Aller à Profils</button>';
      h += '</main>';
      return h;
    }
    var year = new Date().getFullYear();
    var myTotals = {};
    var withPerson = {};
    state.groups.forEach(function(g){
      var iAmIn = g.members.indexOf(state.meId)>=0;
      g.expenses.forEach(function(e){
        if(e.type!=="expense") return;
        var y;
        try{ y = new Date(e.date+"T00:00:00").getFullYear(); }catch(err){ y = null; }
        if(iAmIn && y===year){
          var myShare = shareOfExpense(e, state.meId);
          if(myShare>0) myTotals[g.currency] = (myTotals[g.currency]||0) + myShare;
        }
      });
      if(iAmIn){
        g.members.forEach(function(mid){
          if(mid===state.meId) return;
          if(!withPerson[mid]) withPerson[mid] = {groupIds:{}, totals:{}};
          withPerson[mid].groupIds[g.id] = true;
        });
      }
    });
    Object.keys(withPerson).forEach(function(pid){
      Object.keys(withPerson[pid].groupIds).forEach(function(gid){
        var g = findGroup(gid);
        var t = totalSpent(g);
        withPerson[pid].totals[g.currency] = (withPerson[pid].totals[g.currency]||0) + t;
      });
    });
    h += '<div class="section-title">Mes dépenses en '+year+'</div><div class="card" style="padding:16px;">';
    var curs = Object.keys(myTotals);
    if(curs.length===0){
      h += '<div style="color:var(--ink-muted); font-size:.88rem;">Aucune dépense payée par toi cette année.</div>';
    } else {
      h += curs.map(function(c){ return '<div class="val mono" style="font-size:1.3rem; font-weight:700;">'+fmtMoney(myTotals[c],c)+'</div>'; }).join('');

    h += '</div>';
    h += '<div class="section-title" style="margin-top:10px;">Avec qui tu es sorti</div>';
    var people = Object.keys(withPerson).map(function(pid){
      return {id:pid, n:Object.keys(withPerson[pid].groupIds).length, totals:withPerson[pid].totals};
    });
    people.sort(function(a,b){ return b.n-a.n; });
    if(people.length===0){
      h += '<div class="empty" style="padding:24px 20px;">Pas encore d’événement partagé avec quelqu’un.</div>';
    } else {
      h += '<div class="card">';
      people.forEach(function(p){
        h += '<div class="member-row">'+avatarHtml(p.id)+'<div class="name">'+escapeHtml(personName(p.id))+'<div style="font-size:.72rem; color:var(--ink-muted); font-weight:400;">'+p.n+' événement'+(p.n>1?'s':'')+' ensemble</div></div>';
        h += '<div class="mono" style="font-size:.85rem; font-weight:700; text-align:right;">'+Object.keys(p.totals).map(function(c){return fmtMoney(p.totals[c],c);}).join('<br>')+'</div>';
        h += '</div>';
      });
      h += '</div>';
    }
    h += '</main>';
    return h;
  }

    var g = findGroup(ui.groupId);
    var h = '<h3>'+escapeHtml(g.name)+'</h3>';
    h += '<div class="field"><label>Renommer</label><input type="text" id="f-rename" value="'+escapeHtml(g.name)+'"></div>';
    h += '<div class="sheet-actions"><button class="btn btn-secondary btn-block" data-act="rename-group">Enregistrer le nom</button></div>';
    h += '<div style="height:14px;"></div>';
    h += '<div class="field"><label>Partage entre appareils</label>';
    if(!cloudReady){
      h += '<p style="font-size:.82rem; color:var(--ink-muted); line-height:1.5; margin:0;">La synchronisation n\'est pas configurée sur cette installation. Voir LISEZMOI.txt pour activer le partage en temps réel avec Firebase.</p>';
    } else if(!g.cloud){
      h += '<p style="font-size:.82rem; color:var(--ink-muted); line-height:1.5; margin:0 0 10px;">Active le partage pour que les autres membres voient et modifient ce groupe en direct depuis leur téléphone.</p>';
      h += '<button class="btn btn-secondary btn-block" data-act="enable-cloud">Activer le partage</button>';
    } else {
      h += '<p style="font-size:.82rem; color:var(--ink-muted); line-height:1.5; margin:0 0 10px;">Ce groupe est synchronisé. Envoie ce lien aux autres membres pour qu\'ils le rejoignent.</p>';
      h += '<button class="btn btn-secondary btn-block" data-act="share-group">Partager le lien</button>';
    }
    h += '</div>';
    h += '<button class="btn btn-danger btn-block" data-act="delete-group">Supprimer cet événement</button>';
    h += '<div class="sheet-actions"><button class="btn btn-ghost btn-block" data-act="close-sheet">Fermer</button></div>';
    return h;
  }

  function sheetAddMember(){
    var g = findGroup(ui.groupId);
    var available = state.contacts.filter(function(c){ return g.members.indexOf(c.id)<0; });
    var h = '<h3>Ajouter un membre</h3>';
    if(available.length){
      h += '<div class="field"><label>Depuis tes profils</label><div class="chip-row">';
      available.forEach(function(c){
        h += '<button class="chip" data-act="add-existing-member" data-id="'+c.id+'">'+avatarHtml(c.id)+escapeHtml(c.name)+'</button>';
      });
      h += '</div></div>';
    }
    h += '<div class="field"><label>Ou crée un nouveau profil</label><input type="text" id="f-newmember" placeholder="Ex. Dorian"></div>';
    h += '<div class="sheet-actions"><button class="btn btn-ghost" data-act="close-sheet">Annuler</button><button class="btn btn-primary" data-act="save-member">Ajouter</button></div>';
    return h;
  }

  function sheetExpense(){
    var g = findGroup(ui.groupId);
    var d = ui.sheetData;
    var isEdit = !!d.id;
    var h = '<h3>'+(isEdit?"Modifier la dépense":"Nouvelle dépense")+'</h3>';
    h += '<div class="field"><label>Catégorie</label><div class="cat-row">';
    CATEGORIES.forEach(function(c){
      h += '<button class="cat-chip'+(d.emoji===c.emoji?" selected":"")+'" data-act="pick-category" data-val="'+c.emoji+'"><span class="cat-emoji">'+c.emoji+'</span><span class="cat-lbl">'+c.label+'</span></button>';
    });
    h += '</div></div>';
    h += '<div class="field"><label>Description</label><input type="text" id="f-desc" placeholder="Ex. Courses, restaurant…" value="'+escapeHtml(d.description)+'"></div>';
    h += '<div class="field"><label>Montant</label><div class="amount-input"><input type="text" inputmode="decimal" id="f-amount" placeholder="0,00" value="'+(d.amountCents?(d.amountCents/100).toFixed(2).replace(".",","):"")+'"><span class="cur">'+g.currency+'</span></div></div>';
    h += '<div class="field"><label>Date</label><input type="date" id="f-date" value="'+d.date+'"></div>';
    h += '<div class="field"><label>Payé par</label><div class="chip-row" id="payer-chips">';
    g.members.forEach(function(id){
      h += '<button class="chip'+(d.payerId===id?" selected":"")+'" data-act="pick-payer" data-id="'+id+'">'+avatarHtml(id)+escapeHtml(personName(id))+'</button>';
    });
    h += '</div></div>';
    h += '<div class="field"><label>Pour qui</label><div class="chip-row" id="part-chips">';
    g.members.forEach(function(id){
      var sel = d.participantIds.indexOf(id)>=0;
      h += '<button class="chip'+(sel?" selected":"")+'" data-act="toggle-part" data-id="'+id+'">'+avatarHtml(id)+escapeHtml(personName(id))+(sel?' <span class="check">✓</span>':'')+'</button>';
    });
    h += '</div></div>';
    h += '<div class="field"><label>Répartition</label><div class="segmented"><button data-act="split-mode" data-mode="equal" class="'+(d.splitMode==="equal"?"active":"")+'">Égale</button><button data-act="split-mode" data-mode="custom" class="'+(d.splitMode==="custom"?"active":"")+'">Personnalisée</button></div></div>';
    if(d.splitMode==="custom"){
      var amt = d.amountCents||0;
      var sum = 0;
      h += '<div class="field"><label>Montant par personne</label>';
      d.participantIds.forEach(function(pid){
        var v = (d.customShares&&d.customShares[pid])||0;
        sum += v;
        h += '<div class="split-row"><div class="nm">'+avatarHtml(pid)+escapeHtml(personName(pid))+'</div><input type="text" inputmode="decimal" data-act="custom-share" data-id="'+pid+'" value="'+(v?(v/100).toFixed(2).replace(".",","):"")+'"></div>';
      });
      var remain = amt-sum;
      h += '<div class="split-remainder'+(remain!==0?" err":"")+'" id="split-remainder">'+(remain===0?"Réparti en totalité":("Reste à répartir : "+fmtMoney(remain,g.currency)))+'</div></div>';
    }
    h += '<div class="sheet-actions"><button class="btn btn-ghost" data-act="close-sheet">Annuler</button><button class="btn btn-primary" data-act="save-expense">Enregistrer</button></div>';
    if(isEdit) h += '<button class="btn btn-danger btn-block" style="margin-top:10px;" data-act="delete-expense" data-id="'+d.id+'">Supprimer</button>';
    return h;
  }

  function sheetTransfer(){
    var g = findGroup(ui.groupId);
    var d = ui.sheetData;
    var h = '<h3>Marquer un remboursement</h3>';
    h += '<div class="field"><label>De</label><div class="chip-row">';
    g.members.forEach(function(id){
      h += '<button class="chip'+(d.fromId===id?" selected":"")+'" data-act="pick-from" data-id="'+id+'">'+avatarHtml(id)+escapeHtml(personName(id))+'</button>';
    });
    h += '</div></div>';
    h += '<div class="field"><label>Vers</label><div class="chip-row">';
    g.members.forEach(function(id){
      h += '<button class="chip'+(d.toId===id?" selected":"")+'" data-act="pick-to" data-id="'+id+'">'+avatarHtml(id)+escapeHtml(personName(id))+'</button>';
    });
    h += '</div></div>';
    h += '<div class="field"><label>Montant</label><div class="amount-input"><input type="text" inputmode="decimal" id="f-t-amount" value="'+(d.amountCents?(d.amountCents/100).toFixed(2).replace(".",","):"")+'"><span class="cur">'+g.currency+'</span></div></div>';
    h += '<div class="field"><label>Date</label><input type="date" id="f-t-date" value="'+d.date+'"></div>';
    h += '<div class="sheet-actions"><button class="btn btn-ghost" data-act="close-sheet">Annuler</button><button class="btn btn-primary" data-act="save-transfer">Enregistrer</button></div>';
    if(d.id) h += '<button class="btn btn-danger btn-block" style="margin-top:10px;" data-act="delete-expense" data-id="'+d.id+'">Supprimer</button>';
    return h;
  }

  function sheetBackup(){
    var h = '<h3>Sauvegarde</h3>';
    h += '<p style="font-size:.88rem; color:var(--ink-muted); line-height:1.5;">Tes cagnottes sont stockées uniquement sur cet appareil. Exporte un fichier pour les transférer sur un autre téléphone ou en garder une copie.</p>';
    h += '<div class="sheet-actions"><button class="btn btn-secondary btn-block" data-act="export-data">Exporter (.json)</button></div>';
    h += '<div style="height:10px;"></div>';
    h += '<div class="field"><label>Importer un fichier</label><input type="file" id="f-import" accept="application/json"></div>';
    h += '<div class="sheet-actions"><button class="btn btn-ghost btn-block" data-act="close-sheet">Fermer</button></div>';
    return h;
  }

  function sheetAddContact(){
    var h = '<h3>Nouveau profil</h3>';
    h += '<div class="field"><label>Nom</label><input type="text" id="f-contact-name" placeholder="Ex. Dorian"></div>';
    h += '<div class="sheet-actions"><button class="btn btn-ghost" data-act="close-sheet">Annuler</button><button class="btn btn-primary" data-act="save-contact">Ajouter</button></div>';
    return h;
  }

  function openSheet(name, data){
    ui.sheet = name; ui.sheetData = data || {};
    render();
  }
  function closeSheet(){
    ui.sheet = null; ui.sheetData = null;
    render();
  }

  function bindDraftField(id, key, transform, onChange){
    var el = document.getElementById(id);
    if(!el) return;
    var evt = (el.tagName==="SELECT" || el.type==="date") ? "change" : "input";
    el.addEventListener(evt, function(){
      var d = currentDraft();
      if(!d) return;
      d[key] = transform ? transform(el.value) : el.value;
      if(onChange) onChange();
    });
  }
  function updateSplitRemainder(){
    var d = currentDraft();
    var elR = document.getElementById("split-remainder");
    if(!d || !elR || d.splitMode!=="custom") return;
    var g = findGroup(ui.groupId);
    var sum = 0;
    (d.participantIds||[]).forEach(function(pid){ sum += (d.customShares && d.customShares[pid]) || 0; });
    var remain = (d.amountCents||0) - sum;
    elR.textContent = remain===0 ? "Réparti en totalité" : ("Reste à répartir : "+fmtMoney(remain, g.currency));
    elR.classList.toggle("err", remain!==0);
  }
  function afterRender(){
    var backdrop = document.getElementById("backdrop");
    if(backdrop && ui.sheet){
      if(!backdrop.classList.contains("open")){
        requestAnimationFrame(function(){ backdrop.classList.add("open"); });
      }
      backdrop.addEventListener("click", function(e){
        if(e.target===backdrop) closeSheet();
      });
    }
    if(ui.sheet){
      var toCents = function(v){ var c=parseAmountToCents(v); return isNaN(c)?0:c; };
      bindDraftField("f-name","name");
      bindDraftField("f-currency","currency");
      bindDraftField("f-desc","description");
      bindDraftField("f-date","date");
      bindDraftField("f-amount","amountCents",toCents,updateSplitRemainder);
      bindDraftField("f-t-date","date");
      bindDraftField("f-t-amount","amountCents",toCents);
    }
    var imp = document.getElementById("f-import");
    if(imp){
      imp.addEventListener("change", function(){
        var file = imp.files[0];
        if(!file) return;
        var reader = new FileReader();
        reader.onload = function(){
          try{
            var data = JSON.parse(reader.result);
            if(!data || !Array.isArray(data.groups)) throw new Error("format invalide");
            if(confirm("Remplacer les données actuelles par ce fichier ? Cette action est irréversible.")){
              state = data;
              migrateToContacts();
              save();
              subscribeAllCloudGroups();
              closeSheet();
              ui.screen="home";
              render();
              toast("Données importées");
            }
          }catch(err){
            alert("Fichier invalide ou corrompu.");
          }
        };
        reader.readAsText(file);
      });
    }
  }

  document.addEventListener("click", function(e){
    var el = e.target.closest("[data-act]");
    if(!el || el.getAttribute("data-act")==="custom-share") return;
    var act = el.getAttribute("data-act");
    handleAction(act, el, e);
  });

  document.addEventListener("input", function(e){
    var el = e.target.closest('[data-act="custom-share"]');
    if(el) handleAction("custom-share", el);
  });

  document.addEventListener("keydown", function(e){
    if(e.key==="Escape" && ui.sheet) closeSheet();
  });

  function currentDraft(){ return ui.sheetData; }

  function handleAction(act, el){
    var g;
    switch(act){
      case "open-group":
        ui.groupId = el.getAttribute("data-id"); ui.screen="group"; ui.tab="expenses"; render(); break;
      case "go-home":
        ui.screen="home"; render(); break;
      case "tab":
        ui.tab = el.getAttribute("data-tab"); render(); break;
      case "new-group":
        openSheet("new-group", {name:"", emoji:GROUP_EMOJIS[0], currency:"ARS", memberIds: state.meId?[state.meId]:[]}); break;
      case "pick-emoji":
        currentDraft().emoji = el.getAttribute("data-val"); render(); break;
      case "pick-category":
        currentDraft().emoji = el.getAttribute("data-val"); render(); break;
      case "toggle-draft-contact": {
        var dtc = currentDraft();
        var ctcId = el.getAttribute("data-id");
        var ctcIdx = dtc.memberIds.indexOf(ctcId);
        if(ctcIdx>=0) dtc.memberIds.splice(ctcIdx,1); else dtc.memberIds.push(ctcId);
        render();
        break;
      }
      case "add-draft-contact": {
        var inp = document.getElementById("f-member");
        var val = inp.value.trim();
        if(val){
          var newContact = {id:uid(), name:val};
          state.contacts.push(newContact);
          save();
          currentDraft().memberIds.push(newContact.id);
          render();
        }
        break;
      }
      case "save-new-group": {
        var d = currentDraft();
        var name = (document.getElementById("f-name").value||"").trim();
        var currency = document.getElementById("f-currency").value;
        if(!name){ alert("Donne un nom à cet événement."); return; }
        if(d.memberIds.length<2){ alert("Ajoute au moins deux participants."); return; }
        var newG = {id:uid(), name:name, emoji:d.emoji, currency:currency, members:d.memberIds.slice(), expenses:[], createdAt:Date.now()};
        state.groups.unshift(newG);
        save();
        closeSheet();
        ui.groupId = newG.id; ui.screen="group"; ui.tab="expenses";
        render();
        break;
      }
      case "group-menu":
        openSheet("group-menu", {}); break;
      case "rename-group": {
        g = findGroup(ui.groupId);
        var nv = (document.getElementById("f-rename").value||"").trim();
        if(nv){ g.name = nv; persist(g); }
        closeSheet();
        break;
      }
      case "enable-cloud": {
        g = findGroup(ui.groupId);
        if(!cloudReady){ toast("Synchronisation non configurée."); return; }
        g.cloud = true;
        save();
        syncGroupToCloud(g);
        subscribeGroup(g.id);
        render();
        toast("Partage activé");
        break;
      }
      case "share-group": {
        g = findGroup(ui.groupId);
        var link = location.origin + location.pathname + "?g=" + g.id;
        if(navigator.share){
          navigator.share({title:"RoCount — "+g.name, text:'Rejoins "'+g.name+'" sur RoCount', url:link}).catch(function(){});
        } else if(navigator.clipboard && navigator.clipboard.writeText){
          navigator.clipboard.writeText(link).then(function(){ toast("Lien copié !"); }).catch(function(){ prompt("Copie ce lien :", link); });
        } else {
          prompt("Copie ce lien :", link);
        }
        break;
      }
      case "delete-group":
        g = findGroup(ui.groupId);
        if(confirm('Supprimer "'+g.name+'" et toutes ses dépenses ?')){
          if(cloudUnsub[g.id]){ cloudUnsub[g.id](); delete cloudUnsub[g.id]; }
          state.groups = state.groups.filter(function(x){return x.id!==g.id;});
          save();
          closeSheet();
          ui.screen="home";
          render();
        }
        break;
      case "add-member":
        openSheet("add-member", {}); break;
      case "add-existing-member": {
        g = findGroup(ui.groupId);
        var addId = el.getAttribute("data-id");
        if(g.members.indexOf(addId)<0){ g.members.push(addId); persist(g); }
        closeSheet();
        break;
      }
      case "save-member": {
        g = findGroup(ui.groupId);
        var mn = (document.getElementById("f-newmember").value||"").trim();
        if(mn){
          var newC2 = {id:uid(), name:mn};
          state.contacts.push(newC2);
          g.members.push(newC2.id);
          save();
          persist(g);
          closeSheet();
        }
        break;
      }
      case "remove-member": {
        g = findGroup(ui.groupId);
        var mid = el.getAttribute("data-id");
        var bal = computeBalances(g);
        var used = g.expenses.some(function(e){
          return e.payerId===mid || e.fromId===mid || e.toId===mid || (e.participantIds&&e.participantIds.indexOf(mid)>=0);
        });
        if(used || Math.abs(bal[mid]||0)>0.5){
          alert("Ce membre a des dépenses liées ou un solde non nul : il ne peut pas être retiré.");
          return;
        }
        g.members = g.members.filter(function(id){return id!==mid;});
        persist(g); render();
        break;
      }
      case "new-expense":
        g = findGroup(ui.groupId);
        openSheet("expense", {description:"", amountCents:0, payerId:g.members[0], participantIds:g.members.slice(), splitMode:"equal", date:todayISO(), emoji:"🧾"});
        break;
      case "edit-expense": {
        g = findGroup(ui.groupId);
        var eid = el.getAttribute("data-id");
        var found = g.expenses.find(function(x){return x.id===eid;});
        if(!found) return;
        if(found.type==="transfer") openSheet("transfer", Object.assign({}, found));
        else openSheet("expense", JSON.parse(JSON.stringify(found)));
        break;
      }
      case "pick-payer":
        currentDraft().payerId = el.getAttribute("data-id"); render(); break;
      case "toggle-part": {
        var d2 = currentDraft();
        var pid = el.getAttribute("data-id");
        var idx = d2.participantIds.indexOf(pid);
        if(idx>=0) d2.participantIds.splice(idx,1); else d2.participantIds.push(pid);
        render();
        break;
      }
      case "split-mode":
        currentDraft().splitMode = el.getAttribute("data-mode");
        if(currentDraft().splitMode==="custom" && !currentDraft().customShares) currentDraft().customShares={};
        render();
        break;
      case "save-expense": {
        g = findGroup(ui.groupId);
        var dd = currentDraft();
        var desc = (document.getElementById("f-desc").value||"").trim();
        var cents = parseAmountToCents(document.getElementById("f-amount").value);
        var date = document.getElementById("f-date").value || todayISO();
        if(!desc){ alert("Décris cette dépense."); return; }
        if(isNaN(cents) || cents<=0){ alert("Indique un montant valide."); return; }
        if(!dd.payerId){ alert("Choisis qui a payé."); return; }
        if(!dd.participantIds || dd.participantIds.length===0){ alert("Choisis au moins un participant."); return; }
        if(dd.splitMode==="custom"){
          var sum=0; Object.keys(dd.customShares||{}).forEach(function(k){ if(dd.participantIds.indexOf(k)>=0) sum+=dd.customShares[k]; });
          if(sum!==cents){ alert("La répartition personnalisée doit correspondre exactement au montant total."); return; }
        }
        dd.description = desc; dd.amountCents = cents; dd.date = date;
        if(dd.id){
          var i2 = g.expenses.findIndex(function(x){return x.id===dd.id;});
          g.expenses[i2] = dd;
        } else {
          dd.id = uid(); dd.type="expense"; dd.createdAt = Date.now();
          g.expenses.push(dd);
        }
        persist(g); closeSheet();
        break;
      }
      case "custom-share": {
        var d3 = currentDraft();
        if(!d3.customShares) d3.customShares={};
        d3.customShares[el.getAttribute("data-id")] = parseAmountToCents(el.value)||0;
        updateSplitRemainder();
        break;
      }
      case "delete-expense": {
        g = findGroup(ui.groupId);
        var did = el.getAttribute("data-id");
        if(confirm("Supprimer cette entrée ?")){
          g.expenses = g.expenses.filter(function(x){return x.id!==did;});
          persist(g); closeSheet();
        }
        break;
      }
      case "new-transfer":
        g = findGroup(ui.groupId);
        openSheet("transfer", {fromId:g.members[0], toId:(g.members[1]||g.members[0]), amountCents:0, date:todayISO()});
        break;
      case "settle-now":
        openSheet("transfer", {fromId:el.getAttribute("data-from"), toId:el.getAttribute("data-to"), amountCents:parseInt(el.getAttribute("data-amount"),10), date:todayISO()});
        break;
      case "pick-from":
        currentDraft().fromId = el.getAttribute("data-id"); render(); break;
      case "pick-to":
        currentDraft().toId = el.getAttribute("data-id"); render(); break;
      case "save-transfer": {
        g = findGroup(ui.groupId);
        var td = currentDraft();
        var tc = parseAmountToCents(document.getElementById("f-t-amount").value);
        var tdate = document.getElementById("f-t-date").value || todayISO();
        if(!td.fromId || !td.toId || td.fromId===td.toId){ alert("Choisis deux personnes différentes."); return; }
        if(isNaN(tc) || tc<=0){ alert("Indique un montant valide."); return; }
        td.amountCents = tc; td.date = tdate;
        if(td.id){
          var i3 = g.expenses.findIndex(function(x){return x.id===td.id;});
          g.expenses[i3] = td;
        } else {
          td.id = uid(); td.type="transfer"; td.createdAt = Date.now();
          g.expenses.push(td);
        }
        persist(g); closeSheet();
        toast("Remboursement enregistré");
        break;
      }
      case "open-backup":
        openSheet("backup", {}); break;
      case "export-data":
        exportData(); break;
      case "open-profiles":
        ui.screen="profiles"; render(); break;
      case "open-stats":
        ui.screen="stats"; render(); break;
      case "set-me":
        state.meId = el.getAttribute("data-id"); save(); render(); toast("Profil « Moi » mis à jour"); break;
      case "add-contact":
        openSheet("add-contact", {}); break;
      case "save-contact": {
        var cn = (document.getElementById("f-contact-name").value||"").trim();
        if(cn){ state.contacts.push({id:uid(), name:cn}); save(); closeSheet(); render(); }
        break;
      }
      case "remove-contact": {
        var rmId = el.getAttribute("data-id");
        var usedInGroup = state.groups.some(function(x){ return x.members.indexOf(rmId)>=0; });
        if(usedInGroup){ alert("Ce profil est utilisé dans un ou plusieurs événements : il ne peut pas être supprimé."); return; }
        if(confirm("Supprimer ce profil ?")){
          state.contacts = state.contacts.filter(function(c){return c.id!==rmId;});
          if(state.meId===rmId) state.meId = null;
          save(); render();
        }
        break;
      }
      case "close-sheet":
        closeSheet(); break;
    }
  }

  function exportData(){
    var json = JSON.stringify(state, null, 2);
    var filename = "rocount-sauvegarde-"+todayISO()+".json";
    try{
      var blob = new Blob([json], {type:"application/json"});
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
      toast("Sauvegarde téléchargée");
    }catch(e){
      alert("Impossible de générer le fichier sur cet appareil.");
    }
  }

  if("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").catch(function(){});
    });
  }

  initCloud();
  render();
  subscribeAllCloudGroups();
  checkJoinLink();
})();
</script>
